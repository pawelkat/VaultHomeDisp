[package]
edition      = "2024"
name         = "VaultHomeDisp"
description  = "Embassy firmware for Elecrow CrowPanel 5.79 e-paper (ESP32-S3-WROOM-1-N8R8)"
rust-version = "1.88"
version      = "0.1.0"
autobins     = false

[[bin]]
name = "VaultHomeDisp"
path = "./src/bin/main.rs"

[[bin]]
name = "x4"
path = "./src/bin/x4/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
esp-radio = { version = "0.18.0", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
trouble-host = { version = "0.6", default-features = false, features = [
  "derive",
  "gatt",
  "log",
  "peripheral",
  "default-packet-pool",
  "default-packet-pool-mtu-255",
] }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8"
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-io-async = "0.7"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
heapless = { version = "0.9", default-features = false }
embassy-sync07 = { package = "embassy-sync", version = "0.7", default-features = false }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

slint = { version = "1.16.1", default-features = false, features = [
  "compat-1-2",
  "libm",
  "renderer-software",
  "unsafe-single-threaded",
] }

[build-dependencies]
slint-build = "1.16.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
